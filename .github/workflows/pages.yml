name: Deploy AmiRa — Rahul Character Ecosystem

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate active V25 JavaScript
        run: |
          node --check public/v25.js
      - name: Validate frontend files
        run: |
          test -f public/index.html
          test -f public/v25.js
          test -f public/v19.css
          test -f public/manifest.webmanifest
      - name: Check active V25 assets
        run: |
          grep -q 'v19.css?v=25' public/index.html
          grep -q 'v25.js?v=25' public/index.html
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static AmiRa frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
