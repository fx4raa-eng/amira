name: Deploy AmiRa V9 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate V9 JavaScript
        run: node --check public/v9.js && node --check public/v9-fix.js
      - name: Validate V9 frontend
        run: test -f public/index.html && test -f public/v9.css && test -f public/v9.js && test -f public/v9-fix.js && test -f public/manifest.webmanifest
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static AmiRa frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
